<!doctype html>
<html lang="th">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Convert Skin to Add-On</title>
        <!-- Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Itim&display=swap"
            rel="stylesheet"
        />
        <!-- CSS -->
        <link rel="stylesheet" href="css/variables.css" />
        <link rel="stylesheet" href="css/btn.css" />
        <link rel="stylesheet" href="css/reset.css" />
        <link rel="stylesheet" href="css/fonts.css" />
        <link rel="stylesheet" href="css/styles.css" />
        <link rel="stylesheet" href="css/dialog.css" />
        <link rel="stylesheet" href="css/popup.css" />
        <!-- File -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/file-saver/2.0.5/FileSaver.min.js"></script>

        <!-- Model Viewer -->
        <script
            type="module"
            src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"
        ></script>
    </head>

    <body>
        <!-- Model Display -->
        <div class="model-display">
            <h1 class="gradient-text">แปลงสกินเป็นแอดออน</h1>
            <div class="model-display__border">
                <div class="model-display__inner">
                    <model-viewer
                        class="model-display__viewer"
                        id="mainModel"
                        src="models/display.model.glb"
                        alt="กำลังโหลดโมเดล..."
                        auto-rotate
                        camera-controls
                        camera-orbit="180deg 75deg 5m"
                        min-camera-orbit="auto auto 5m"
                        max-camera-orbit="auto auto 5m"
                        interaction-prompt="auto"
                    >
                    </model-viewer>
                </div>
            </div>
            <!-- Controls Button -->
            <div class="controls-panel">
                <!-- ใส่สกิน (label ผูกกับ input file ได้ตามปกติ) -->
                <div class="input-skin_container">
                    <label for="upload-skin" class="btn upload-skin__btn"
                        >เลือกสกิน 📥</label
                    >
                    <input
                        type="file"
                        id="upload-skin"
                        accept="image/*"
                        hidden
                    />
                </div>
                <!-- ต่อไป (ปุ่มจริง ไม่ใช้ label + hidden button) -->
                <div class="continue_container">
                    <button
                        type="button"
                        id="continue"
                        class="btn continue__btn"
                    >
                        ต่อไป
                    </button>
                </div>
            </div>
        </div>
        <!-- หน้าต่างตั้งค่า -->
        <div class="settings-overlay" id="settings-overlay" hidden>
            <div class="settings-modal" role="dialog" aria-modal="true">
                <button
                    type="button"
                    class="settings-modal__close"
                    id="settings-close"
                    aria-label="ปิด"
                >
                    ❌️
                </button>
                <h1 class="gradient-text">ตั้งค่าเพิ่มเติม</h1>
                <!-- Indentifier-->
                <div class="field">
                    <label class="field__label" for="identifier"
                        >✒️ Identifier</label
                    >
                    <input
                        type="text"
                        class="textbar"
                        id="identifier"
                        placeholder="เช่น my:skinpack"
                        autocomplete="off"
                    />
                </div>
                <!-- Name Pack -->
                <div class="field">
                    <label class="field__label" for="namePack"
                        >✏️ Name Pack</label
                    >
                    <input
                        type="text"
                        class="textbar namepack"
                        id="namePack"
                        placeholder="เช่น My Skin Pack"
                        autocomplete="off"
                    />
                </div>
                <!-- เลือกส่วน -->
                <div class="field">
                    <span class="field__label">เลือกส่วนที่ต้องการ</span>
                    <div
                        class="dropdown"
                        data-placeholder="เลือก..."
                        data-name="part"
                    >
                        <button
                            type="button"
                            class="dropdown__toggle"
                            aria-expanded="false"
                        >
                            <span class="dropdown__text"></span>
                            <span class="dropdown__arrow">▾</span>
                        </button>
                        <div class="dropdown__menu">
                            <label class="dropdown__item">
                                <input type="checkbox" value="หัว" /> หัว
                            </label>
                            <label class="dropdown__item">
                                <input type="checkbox" value="ตัว" /> ตัว
                            </label>
                            <label class="dropdown__item">
                                <input
                                    type="checkbox"
                                    value="หัว+ตัว (รวมชิ้น)"
                                />
                                หัว+ตัว (รวมชิ้น)
                            </label>
                        </div>
                    </div>
                </div>

                <!-- เลือกโมเดล -->
                <div class="field">
                    <span class="field__label">เลือกโมเดล</span>
                    <div
                        class="dropdown"
                        data-placeholder="เลือกโมเดล..."
                        data-name="model"
                    >
                        <button
                            type="button"
                            class="dropdown__toggle"
                            aria-expanded="false"
                        >
                            <span class="dropdown__text"></span>
                            <span class="dropdown__arrow">▾</span>
                        </button>
                        <div class="dropdown__menu">
                            <label class="dropdown__item">
                                <input
                                    type="checkbox"
                                    value="Steve"
                                    data-exclusive
                                />
                                Steve (ชาย)
                            </label>
                            <label class="dropdown__item">
                                <input
                                    type="checkbox"
                                    value="Alex"
                                    data-exclusive
                                />
                                Alex (หญิง)
                            </label>
                        </div>
                    </div>
                </div>
                <!-- ยืนยัน -->
                <div class="confirm_container">
                    <button type="button" id="confirm" class="btn confirm__btn">
                        แปลงเลย!
                    </button>
                </div>
            </div>
        </div>
        <!-- PopUP -->
        <div class="popup" id="popup" role="alert" aria-live="polite">
            <span class="popup__text" id="popup-text"></span>
        </div>
        <script src="js/alert.js"></script>
        <script src="js/index.js"></script>
        <script src="js/btn.js"></script>
        <script src="js/confirm.js"></script>
    </body>
</html>
